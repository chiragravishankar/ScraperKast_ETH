[package]
name = "scraperkast-solana"
version = "0.1.0"
description = "ScraperKast on-chain payment program — enforces 95/5 USDC split between website owners and the platform"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "scraperkast_solana"

[features]
no-entrypoint = []
no-idl = []
no-log-cx = []
use-shared-memory = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["token", "associated_token"] }
